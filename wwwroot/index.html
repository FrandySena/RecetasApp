<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetario Express - ASP.NET Core</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <h1 class="text-center mb-4">📖 Gestor de Recetas de Cocina</h1>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title mb-3" id="formTitle">Nueva Receta</h5>
                <form id="recipeForm">
                    <input type="hidden" id="recipeId">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre de la Receta</label>
                            <input type="text" id="title" class="form-control" required placeholder="Ej: Mangu con Queso">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Categoría</label>
                            <select id="category" class="form-select" required>
                                <option value="Desayuno">Desayuno</option>
                                <option value="Almuerzo">Almuerzo</option>
                                <option value="Cena">Cena</option>
                                <option value="Postre">Postre</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Tiempo (minutos)</label>
                            <input type="number" id="prepTimeMinutes" class="form-control" min="1" required placeholder="25">
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Ingredientes</label>
                            <input type="text" id="ingredients" class="form-control" required placeholder="Plátanos verdes, sal, queso">
                        </div>
                        <div class="col-12">
                            <label class="form-label">Instrucciones</label>
                            <textarea id="instructions" class="form-control" rows="2" required></textarea>
                        </div>
                    </div>
                    <div class="mt-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Guardar Receta</button>
                        <button type="button" class="btn btn-secondary d-none" id="btnCancel" onclick="resetForm()">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>Lista de Recetas</h3>
            <input type="text" id="searchInput" class="form-control w-25" placeholder="Buscar receta..." onkeyup="filterRecipes()">
        </div>
        <div class="row" id="recipesList"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
